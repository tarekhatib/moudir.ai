name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moudir
          POSTGRES_PASSWORD: moudir
          POSTGRES_DB: moudir
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moudir" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts migrations
      - run: pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql://moudir:moudir@localhost:5432/moudir
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only
      - run: docker build -t moudir-backend backend
      - run: docker build -t moudir-web dashboard
      - name: Caddyfile is valid
        run: docker run --rm moudir-web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

# Production stack: Postgres, the FastAPI backend and the dashboard behind Caddy (HTTPS).
# Configure with a .env file next to this one (see .env.example), then: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moudir
      POSTGRES_USER: moudir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moudir -d moudir"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://moudir:${POSTGRES_PASSWORD}@db:5432/moudir
      CORS_ORIGINS: ""
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  web:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
